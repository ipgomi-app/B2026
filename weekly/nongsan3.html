<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영남본부 자료 자동화 3</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#1c2430;--mut:#66707d;--line:#d9dee5;--navy:#1f3a93;--accent:#2b6cb0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic","맑은 고딕",system-ui,sans-serif;font-size:14px}
header{background:#111;color:#fff;padding:14px 20px;font-size:20px;font-weight:700}
header small{font-weight:400;color:#bbb;margin-left:10px;font-size:13px}
main{padding:16px 20px 60px;max-width:1800px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:15px;color:var(--navy)}
textarea{width:100%;min-height:120px;font:12px/1.4 Consolas,monospace;border:1px solid var(--line);border-radius:6px;padding:8px;white-space:pre;overflow:auto}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.row label{display:flex;align-items:center;font-size:12px;color:var(--mut);gap:4px}
input[type=text],input[type=number],select{border:1px solid var(--line);border-radius:5px;padding:5px 7px;font-size:13px}
input[type=number]{width:60px;text-align:right}
button{background:var(--accent);color:#fff;border:0;border-radius:6px;padding:8px 14px;font-size:13px;cursor:pointer}
button.sec{background:#fff;color:var(--accent);border:1px solid var(--accent)}
button:hover{filter:brightness(1.08)}
button.xs{padding:2px 8px;font-size:11px;float:right;margin-bottom:4px}
.hint{font-size:12px;color:var(--mut);margin-top:6px}
.ok{color:#137333;font-size:12px}
.bad{color:#b00020;font-size:12px}
.tabs{display:flex;gap:6px;margin-bottom:14px;align-items:center}
.tabs button{background:#fff;color:var(--navy);border:1px solid var(--line);border-bottom:3px solid transparent;border-radius:6px 6px 0 0;font-weight:700}
.tabs button.on{border-bottom-color:var(--navy);background:#e8edf8}
.tabpane{display:none}.tabpane.on{display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:1000px){.grid{grid-template-columns:1fr}}
.prev{overflow:auto;border:1px solid var(--line);border-radius:6px;padding:10px;background:#fff}
table.xl{border-collapse:collapse;font-family:"Malgun Gothic";font-size:10pt;table-layout:fixed}
table.xl td{border:.5pt solid #000;padding:1px 4px;height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
table.xl td.h{background:#1f3a93;color:#fff;font-weight:700;text-align:center}
table.xl td.hg{background:#d9d9d9;font-weight:700;text-align:center}
table.xl td.c{text-align:center}
table.xl td.n{text-align:right}
table.xl td.txt{text-align:left}
table.xl td.upd{background:#fff2cc}
table.xl td.new{background:#e2f0d9}
table.xl td[contenteditable]:focus{outline:2px solid #2b6cb0;background:#eef4ff}
table.xl td.bad{background:#fde2e2!important;color:#b00020}
.legend{font-size:12px;color:var(--mut);margin-top:6px}
.legend i{display:inline-block;width:14px;height:12px;border:1px solid #999;vertical-align:middle;margin:0 3px 0 8px}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:10px;background:#e8edf8;color:var(--navy);margin-left:6px}
.zoom{margin-left:auto;display:flex;gap:6px;align-items:center;font-size:12px;color:#bbb;font-weight:400}.zoom button{background:#333;color:#fff;border:1px solid #555;border-radius:5px;padding:2px 9px;font-size:13px;line-height:1.2}.zoom b{color:#fff;min-width:44px;text-align:center}header{display:flex;align-items:center;flex-wrap:wrap}
</style>
</head>
<body>
<header>영남본부 자료 자동화 3 <small>영남영업본부 · 업무일지 한 번 붙여넣기 → 농산·단가인상·타겟·경쟁사·건설현장 참조시트 자동 업데이트</small><span class="zoom">화면 <button id="zoomOut" title="축소">−</button><b id="zoomVal">100%</b><button id="zoomIn" title="확대">+</button><button id="zoomReset" title="100%">원래대로</button></span></header>
<main>
<div class="card" style="padding:10px 16px">
  <div class="row">
    <b style="color:var(--navy)">주차 선택</b>
    <label>날짜 <input type="date" id="wkdate"></label>
    <span id="wkrange" class="hint" style="margin:0"></span>
    <label>주차 표기 <input type="text" id="wklabel" style="width:90px" placeholder="9월3주"></label>
    <span class="hint" style="margin:0">주는 금요일~목요일. 선택한 기간의 업무일지만 반영됩니다. 주차 표기는 자동 계산되며 직접 고칠 수 있습니다.</span>
  </div>
</div>
<div class="card">
  <h2>1. 업무일지 붙여넣기 <span class="tag">모든 시트 공통</span></h2>
  <textarea id="diary" placeholder="업무일지 조회 결과(PRG_GUBUN … 또는 VISIT_DAT … DIARY_NUM 머리글 행과 DIARY_NUM/DTL_TYP/HEAD_DTL 상세 행)를 그대로 붙여넣으세요. 한 번만 붙이면 아래 모든 시트에 같이 쓰입니다."></textarea>
  <div id="diarystat" class="hint"></div>
</div>
<div class="tabs" id="tabs"></div>
<div id="panes"></div>
</main>
<script>
/* ===== 공통 ===== */
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const num=v=>{const n=parseFloat(String(v??'').replace(/[^0-9.\-]/g,''));return isNaN(n)?0:n};
function parseTSV(s){
  const rows=[];let row=[],cell='',q=false;s=s.replace(/\r\n?/g,'\n').replace(/[\u00A0\u1680\u2000-\u200B\u202F\u205F\u3000\uFEFF]/g,' ').replace(/[\u200C-\u200F\u2028\u2029\u00AD]/g,'');
  for(let i=0;i<s.length;i++){const ch=s[i];
    if(q){ if(ch=='"'){ if(s[i+1]=='"'){cell+='"';i++}else q=false } else cell+=ch }
    else{ if(ch=='"'&&cell===''){q=true}
      else if(ch=='\t'){row.push(cell);cell=''}
      else if(ch=='\n'){row.push(cell);rows.push(row);row=[];cell=''}
      else cell+=ch }
  }
  row.push(cell);rows.push(row);
  return rows.filter(r=>r.some(c=>c.trim()!==''));
}
function addClearButtons(){document.querySelectorAll('main textarea').forEach(ta=>{if(ta.dataset.clr)return;ta.dataset.clr='1';const b=document.createElement('button');b.className='sec xs';b.textContent='초기화';b.onclick=()=>{ta.value='';ta.dispatchEvent(new Event('cleared'));ta.focus()};ta.parentNode.insertBefore(b,ta)})}
async function copyText(t){try{await navigator.clipboard.writeText(t);return true}catch(e){}
  try{const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.left='-9999px';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();return ok}catch(e){return false}}
const ORDER={'방문':1,'견적':2,'계약완료':3};
const stageOf=v=>{v=String(v||'');if(v.includes('계약완료')||v.includes('계약전환완료')||v.includes('계약체결'))return '계약완료';if(v.includes('견적'))return '견적';if(v.includes('방문'))return '방문';return ''};
/* 주 = 금요일~목요일. 선택한 날짜가 속한 주의 금요일/목요일 */
function weekOf(dt){const fri=new Date(dt);fri.setDate(dt.getDate()-((dt.getDay()-5+7)%7));const thu=new Date(fri);thu.setDate(fri.getDate()+6);return {fri,thu}}
/* 주차 표기: 금요일이 속한 달 기준, 그 달의 목요일 개수로 N주 (9/11~9/17=9월3주, 9/25~10/1=9월5주) */
function weekLabel(y,m,d){const {fri,thu}=weekOf(new Date(y,m-1,d));const M=fri.getMonth();let n=0;
  for(let x=1;x<=31;x++){const t=new Date(fri.getFullYear(),M,x);if(t.getMonth()!==M)break;if(t.getDay()===4&&t<=thu)n++}
  if(thu.getMonth()!==M)n++;return (M+1)+'월'+n+'주'}
const fmtMD=d=>(d.getMonth()+1)+'/'+d.getDate();
const ymd=d=>d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
function curWeek(){const v=$('wkdate').value;if(!v)return null;const [y,m,d]=v.split('-').map(Number);const w=weekOf(new Date(y,m-1,d));return {from:ymd(w.fri),to:ymd(w.thu),label:$('wklabel').value.trim()||weekLabel(y,m,d),text:fmtMD(w.fri)+'~'+fmtMD(w.thu)}}
function onWeekChange(auto){const w=curWeek();if(!w){$('wkrange').textContent='';return}$('wkrange').textContent='기간 '+w.text+' (금~목)';if(auto){const v=$('wkdate').value.split('-').map(Number);$('wklabel').value=weekLabel(v[0],v[1],v[2])}Object.keys(S).forEach(k=>{if(S[k].out)runSheet(k)})}
function parseDate(s){const m=String(s||'').match(/(\d{4})[\/\-.]?(\d{1,2})[\/\-.]?(\d{1,2})/);return m?{y:+m[1],m:+m[2],d:+m[3],key:m[1]+String(m[2]).padStart(2,'0')+String(m[3]).padStart(2,'0')}:null}

/* ===== 업무일지 ===== */
function parseDiary(raw){
  const lines=raw.replace(/\r/g,'').split('\n');const out=[];let mainH=null,cur=null;
  for(const line of lines){if(!line.trim())continue;const f=line.split('\t');
    const F=f.map(x=>String(x||'').trim());
    /* 머리글: PRG_GUBUN 형식 또는 VISIT_DAT 형식(VISIT_DAT … CST_COD … DIARY_NUM) 모두 인식 */
    if(F[0]==='PRG_GUBUN'||(F.includes('VISIT_DAT')&&F.includes('DIARY_NUM')&&F.includes('CST_COD'))){mainH=F;continue}
    if(F[1]==='DIARY_NUM'&&F[2]==='DTL_TYP')continue;
    if(F.every(x=>/^[A-Z_]+$/.test(x)||x===''))continue;/* 잘린 머리글 조각(RTL_STC_QTY DIARY_NUM 등) */
    if(!mainH&&/^\d{4}[\/.-]\d{1,2}[\/.-]\d{1,2}$/.test(F[0])&&/^\d{6,}$/.test(F[F.length-1]||''))mainH=['VISIT_DAT','VISIT_EMP','VISIT_EMP_NAM','DIARY_TYP_NAM','CST_COD','CST_NAM','TEL_NUM','ZIP_ADDR','STC_QTY','ACT_STC_QTY','LOADED_QTY','OTH_CST_QTY','OTH_USE_QTY','VOID_QTY','ETC_DESC','RTL_STC_QTY','DIARY_NUM'];/* 머리글 없이 시작한 VISIT_DAT 형식 */
    if(mainH&&F[0]){const g=k=>{const i=mainH.indexOf(k);return i>=0?(F[i]||''):''};const dn=g('DIARY_NUM');
      if(/^\d{6,}$/.test(dn)&&/\d{4}/.test(g('VISIT_DAT'))){cur={num:dn,date:parseDate(g('VISIT_DAT')),emp:g('VISIT_EMP_NAM')||g('VISIT_EMP'),code:g('CST_COD'),name:g('CST_NAM'),group:g('TF_GROUP'),addr:g('ZIP_ADDR'),dtl:[]};out.push(cur);continue}}
    if(f[0].trim()===''&&/^\d{6,}$/.test(String(f[1]||'').trim())){const num_=f[1].trim();let tgt=out.find(x=>x.num===num_)||cur;if(tgt)tgt.dtl.push({typ:String(f[3]||'').trim(),text:f.slice(4).join(' ').trim()})}
  }
  return out.filter(x=>x.code);
}
/* 일지 한 건 → 갱신 정보 */
function diaryInfo(d){
  const all=d.dtl.map(x=>x.typ+' '+x.text).join(' ')+' '+d.group;
  let stage='방문';
  if(/계약완료|계약전환완료|계약체결|계약서\s*체결/.test(all))stage='계약완료';
  else if(/견적서|견적\s*(진행|제출|발송|전달|완료|재진행)|견적중/.test(all))stage='견적';
  let amt=null;const m1=all.match(/예상매출액\s*:\s*([\d,]+)\s*\(원\)/);
  if(m1)amt=Math.round(num(m1[1])/1000);
  else{const m2=all.match(/예상매출\s*([\d.,]+)\s*(억|천원|만원)/);if(m2){const v=num(m2[1]);amt=m2[2]==='억'?Math.round(v*100000):m2[2]==='만원'?Math.round(v*10):Math.round(v)}}
  const pick=(re)=>{for(const x of d.dtl){const m=x.text.match(re);if(m&&m[1].trim())return m[1].trim()}return ''};
  const rawMemo=(pick(/계약특이사항\s*:\s*(.+)$/)||pick(/방문내역\s*:?\s*(.+)$/)||pick(/비고\s*:\s*(.+)$/)||(d.dtl[0]?d.dtl[0].text:'')).replace(/\s+/g,' ').trim();
  const special=pick(/계약특이사항\s*:\s*(.+)$/);
  return {stage,amt,memo:rawMemo,parts:extractParts(d,all,special),raw:all,special:!!special};
}
/* ===== 세부내용 표준화: 소재지, 품목, 내용, 물동량, 예상매출[, 계획] ===== */
const PLACE_RE=/^[가-힣]{2,4}$/;
const ITEM_WORDS=['농산물저장 및 유통','농산물유통','농산물 유통','농산유통','농산물저장','농산물','농산','감귤','월동무','버섯','채소','과일','한과','식품','유통','농협','APC센터','산지유통센터','농업회사법인'];
function placeFromAddr(a){a=String(a||'').trim();if(!a)return '';const t=a.split(/\s+/);let x=t[1]||t[0]||'';if(/^(제주)/.test(t[0])&&/^제주/.test(x))return '제주';
  x=x.replace(/(특별자치시|특별자치도|광역시|특별시|시|군|구)$/,'');return PLACE_RE.test(x)?x:''}
function volumeFrom(t){const U='(매|개|대|박스|롤|장|팩|EA|ea|set|SET)';
  let m=t.match(new RegExp('(?:예상)?물동량\\s*([\\d.,]+)\\s*(만|천)?\\s*'+U+'\\s*\\/?\\s*(년|월)?'));if(!m)m=t.match(new RegExp('([\\d.,]+)\\s*(만|천)?\\s*'+U+'\\s*\\/\\s*(년|월)'));
  if(m){let v=num(m[1]);if(m[2]==='만')v*=10000;else if(m[2]==='천')v*=1000;if(m[4]==='월')v*=12;const u=m[3]==='매'?'매':m[3];return v>0?'물동량 '+Math.round(v).toLocaleString('en-US')+u+'/년':''}
  const m3=t.match(/예상물동량\s*\(매\/월\)\s*:\s*([\d,]+)/);if(m3){const v=num(m3[1])*12;return v>0?'물동량 '+v.toLocaleString('en-US')+'매/년':''}return ''}
function amtToEok(amt){if(!amt)return '';if(amt<1000)return '예상매출 '+Math.round(amt).toLocaleString('en-US')+'천원/년';let e=amt/100000;let s=e.toFixed(2).replace(/\.?0+$/,'');if(s==='0')s=e.toFixed(3).replace(/\.?0+$/,'');return '예상매출 '+s+'억/년'}
function cleanVisitText(t){return String(t||'')
  .replace(/(일자|업체코드|업체명|제목|계약형태|매출액구분|연간예상매출액|예상수익율|경쟁사 구분|방문업체 현황구분|경쟁사 예상물동량[^:]*|경쟁사 예상매출액[^:]*|사용단가[^:]*|PPS|산업자재\(판매\)|SCM|지게차|건설장비|OA)\s*:\s*[^:|]*?(?=(?:\s*\/?\s*[가-힣A-Za-z ()\/]{2,20}\s*:)|\s*\||$)/g,' | ')
  .replace(/\d\s*\.\s*(?=[가-힣])/g,' | ')
  .replace(/(면담자|담당자)\s*:?\s*[^|,]{1,12}/g,' | ')
  .replace(/(방문목적|방문내역|경쟁사현황|영업현황|향후계획|비고|계약특이사항|신규계약|재계약)\s*:?\s*(?=\S)/g,' | ').replace(/\b0?\d{2,3}[- ]?\d{3,4}[- ]?\d{4}\b/g,'').replace(/\(\s*\)/g,'').replace(/\s{2,}/g,' | ').replace(/\s*\|\s*/g,' | ').trim()}
function planFrom(t){const m=t.match(/향후계획\s*:?\s*([^|]+)/);if(m)return m[1].replace(/\s+/g,' ').trim().replace(/[.,\-\s]+$/,'');
  const seg=splitTok(t).filter(x=>/(예정|재방문|협의 예정|추진 예정|제안 예정|필요)$/.test(x.trim())&&x.length<=50);return seg.length?seg[seg.length-1].replace(/^[\-\s]+|[\-\s.,]+$/g,''):''}
const splitTok=t=>String(t||'').split(/\s*\|\s*|\s*,\s*(?!\d{3}(?!\d))|\s-\s|(?<=\S)-\s(?=[가-힣A-Za-z0-9])|(?<=[가-힣)])\.\s+(?=[가-힣A-Z])/).map(x=>x.replace(/^[\-\s.]+|[\-\s.]+$/g,'').trim()).filter(Boolean);
const DROP_RE=/물동량|매\/년|매\/월|예상매출|예상수익|억\/년|천원\/년|^(타겟업체|경쟁사현황|경쟁사현황\s*파악|경쟁사계약처|기타|실재고없음|신규계약|재계약협의|경쟁사전환|방문목적|방문내역|영업현황|비고|정보조사|파악|현황파악|내용|세부내용|경쟁사\s*사용\s*업체|경쟁사\s*업체|타겟업체\s*방문|신규\s*방문|재방문)$|^(향후계획|계약특이사항)/;
const NAME_RE=/^[가-힣]{2,4}(대표|이사|과장|실장|센터장|기사|팀장|부장|사장|소장|대리|주임)(\s*면담)?$/;
const COMP_RE=/^(AJ|NPC|KCP|N사|AJ&NPC|아주)$/i;
function extractParts(d,all,special){
  const P={place:'',item:'',body:'',vol:'',plan:''};
  const specTok=special?splitTok(special):[];
  if(specTok[0]&&PLACE_RE.test(specTok[0]))P.place=specTok[0];
  if(!P.place)P.place=placeFromAddr(d.addr);
  if(specTok[1]&&!/\d/.test(specTok[1])&&specTok[1].length<=14)P.item=specTok[1];
  if(!P.item){const w=ITEM_WORDS.find(k=>all.includes(k));if(w)P.item=w}
  P.vol=volumeFrom(all);
  let comp=(all.match(/경쟁사 구분\s*:\s*([A-Za-z&]+)/)||[])[1]||'';
  const spec=(all.match(/(\d{2,3}\s*\/\s*\d{3,5}\s*\/\s*\d{3,4})/)||[])[1];
  const isPI=x=>x===P.place||x===P.item||PLACE_RE.test(x)&&x===placeFromAddr(d.addr);
  let segs;
  if(special)segs=specTok.slice(2);

  tabs.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;tabs.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('.tabpane').forEach(x=>x.classList.toggle('on',x.id==='pane-'+b.dataset.tab))});
})();

/* ===== 참조시트 파싱 (공통) ===== */
function parseRef(raw,sh){
  const rows=parseTSV(raw);if(!rows.length)return null;
  const W=Math.max(...rows.map(r=>r.length));
  const codeCol=r=>r.findIndex(x=>CODE_RE.test(String(x).trim()));
  const firstData=rows.findIndex(r=>codeCol(r)>=0);if(firstData<0)return null;
  const hdr=rows.slice(0,firstData).slice(-4);
  const htxt=Array.from({length:W},(_,i)=>hdr.map(r=>String(r[i]||'').replace(/\s/g,'')).join(' '));
  const find=(keys,last)=>{for(const k of keys){const hits=[];for(let i=0;i<W;i++)if(htxt[i].includes(k.replace(/\s/g,'')))hits.push(i);if(hits.length)return last?hits[hits.length-1]:hits[0]}return -1};
  const c={};for(const k in sh.H)c[k]=find(sh.H[k],(sh.last||[]).includes(k));
  {const cnt={};rows.slice(firstData).forEach(r=>r.forEach((x,i)=>{if(CODE_RE.test(String(x).trim()))cnt[i]=(cnt[i]||0)+1}));const best=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0];if(best!=null&&(c.code<0||(cnt[c.code]||0)<cnt[best]/2))c.code=+best}
  if(c.memo<0)c.memo=W-1;
  // 블록: 코드가 있는 행 + 이어지는 코드 없는 행
  const blocks=[];let cur=null;
  rows.slice(firstData).forEach(r=>{const cells=r.slice();while(cells.length<W)cells.push('');const cs=cells.map(x=>String(x).trim());
    const code=CODE_RE.test(cs[c.code])?cs[c.code]:'';
    if(code){cur={code,rows:[cs]};blocks.push(cur)}else if(cur)cur.rows.push(cs)});
  let hit=Object.keys(sh.H).filter(k=>c[k]>=0);
  if(sh.layout==='major'){const g=(r,k)=>c[k]>=0?String(r[c[k]]||'').trim():'';
    const nb=blocks.map(b=>{const r=b.rows[0];return {code:b.code,rows:[[g(r,'region'),g(r,'branch'),g(r,'person'),b.code,g(r,'name'),g(r,'stage'),g(r,'amt'),g(r,'memo')]]}});
    const nc={code:3,region:0,branch:1,person:2,name:4,stage:5,amt:6,memo:7};hit=Object.keys(nc);
    return {c:nc,W:8,hdr:[['부서','팀/지점','담당자','코드','업체명','진행단계','효과금액(年)','26년 영업진행사항']],blocks:nb,hit,major:true}}
  return {c,W,hdr,blocks,hit};
}

/* ===== 실행 ===== */
function runSheet(k){
  const sh=SHEETS[k],st=S[k];
  const ref=parseRef($(k+'-ref').value,sh);if(!ref){alert(sh.name+' 참조시트를 먼저 붙여넣으세요 (코드가 있는 행이 필요)');return}
  st.ref=ref;
  $(k+'-refstat').textContent='참조시트 인식: '+ref.blocks.length+'개 업체, 열 '+ref.W+'개 · 인식된 열: '+ref.hit.map(h=>h+'='+(ref.c[h]+1)).join(', ')+(Object.keys(sh.H).some(h=>ref.c[h]<0)?' · 못 찾은 열: '+Object.keys(sh.H).filter(h=>ref.c[h]<0).join(', '):'');
  const wk=curWeek();if(!wk){alert('맨 위에서 주차(날짜)를 먼저 선택하세요');return}
  const diaryAll=parseDiary($('diary').value);const diary=diaryAll.filter(d=>d.date&&d.date.key>=wk.from&&d.date.key<=wk.to);
  $('diarystat').textContent='업무일지 인식: '+diaryAll.length+'건 중 '+wk.text+' 기간 '+diary.length+'건, 업체 '+new Set(diary.map(d=>d.code)).size+'개';
  const byCode={};diary.forEach(d=>{(byCode[d.code]=byCode[d.code]||[]).push(d)});
  const c=ref.c;const smode=$(k+'-stagemode')?$(k+'-stagemode').value:'max';const amode=$(k+'-amtmode')?$(k+'-amtmode').value:'new';const mmode=$(k+'-memomode')?$(k+'-memomode').value:'std';
  st.edits={};let updCount=0;const codes=new Set(ref.blocks.map(b=>b.code));
  const rows=[];
  ref.blocks.forEach(b=>{let ds=byCode[b.code];if(ds&&c.biz>=0){const bk=bizKey(b.rows[0][c.biz]);ds=ds.filter(d=>bizMatch(bk,d.dtl.map(x=>x.text).join(' ')+' '+d.group))}
    if(ds&&sh.eng)ds=ds.filter(d=>{const t=d.dtl.map(x=>x.text).join(' ')+' '+diaryCategory(d);return /프로젝트\s*구분\s*:\s*엔지니어링|엔지니어링/.test(t)||ENG_RE.test(t)});
    if(ds&&sh.require)ds=ds.filter(d=>{const t=d.dtl.map(x=>x.text).join(' ')+' '+d.group;const cat=diaryCategory(d);if(PRICE_CAT_RE.test(cat))return true;return !NONSALES_RE.test(cat)&&!/경쟁사\s*전환|재전환|신규\s*계약|타겟업체|점유율\s*확대/.test(t)&&PALLET_RE.test(t)&&detectKind(t)!==''});const chg={};let upd=false;
    const main=b.rows[0].slice();const extra=b.rows.slice(1).map(r=>r.slice());
    if(ds&&ds.length){upd=true;
      const sorted=ds.slice().sort((x,y)=>(y.date?y.date.key:'').localeCompare(x.date?x.date.key:''));
      const infos=sorted.map(d=>diaryInfo(d));const latest=sorted[0];
      let stage='',amt=null;infos.forEach(i=>{if(ORDER[i.stage]>(ORDER[stage]||0))stage=i.stage;if(amt==null&&i.amt!=null&&i.amt>0)amt=i.amt});
      const all=sorted.map(d=>d.dtl.map(x=>x.text).join(' ')+' '+d.group).join(' ');
      const set=(col,v)=>{if(col>=0&&v!=null&&v!==''&&main[col]!==v){main[col]=v;chg[col]=1}};
      if(ref.major&&c.person>=0&&!main[c.person]&&latest.emp)set(c.person,latest.emp);
      if(sh.eng){
        Object.keys(ENG_EQ).forEach(k2=>{if(c[k2]>=0&&ENG_EQ[k2].test(all)&&!main[c[k2]])set(c[k2],'O')});
        if(c.scope>=0&&!main[c.scope]){const sc=Object.keys(ENG_EQ).filter(k2=>ENG_EQ[k2].test(all)).map(k2=>({eq_load:'자동상하차',eq_stacker:'스태커크레인',eq_shuttle:'멀티셔틀',eq_robot:'복합로봇',eq_agv:'AGV/AMR',eq_agf:'무인지게차',eq_pal:'로봇파렛타이저',eq_mono:'모노레일',eq_sorter:'자동소터'})[k2]);set(c.scope,sc.length?sc.join('/'):(/자동\s*창고|자동화\s*창고/.test(all)?'자동화창고':'자동화설비'))}
        if(c.stage>=0){const ns=engStage(all);const os=main[c.stage];const oi=ENG_STAGE.findIndex(x=>os.includes(x.split('/')[0]));const ni=ENG_STAGE.indexOf(ns);if(smode==='new'?ns!==os:ni>oi)set(c.stage,ns)}
        if(c.amt>=0&&amode==='new'){const a=engAmt(all);if(a!=null&&a>0&&num(main[c.amt])!==a)set(c.amt,String(a))}
        const isRe=c.vnew>=0&&main[c.vnew]!=='';
        if(isRe){if(c.vre>=0)set(c.vre,wk.label);if(c.revisit>=0)set(c.revisit,'재방문')}else{if(c.vnew>=0)set(c.vnew,wk.label);if(c.revisit>=0)set(c.revisit,'신규방문')}
        if(/동행/.test(all)){if(c.le>=0)set(c.le,wk.label);if(c.accomp>=0)set(c.accomp,'동행방문')}else if(c.accomp>=0&&!main[c.accomp])set(c.accomp,'X');
        if(c.memo>=0){const m=engMemo(latest);if(m)set(c.memo,m)}
      }else if(sh.append){
        const dt=latest.date;const md=String(dt.m).padStart(2,'0')+'/'+String(dt.d).padStart(2,'0');
        const text=sorted.map(d=>splitTok(cleanVisitText(d.dtl.map(x=>x.text).join(' | '))).filter(x=>x.length>=2&&!DROP_RE.test(x)).join(', ')).filter(Boolean).join(' / ');
        const line=new Array(ref.W).fill('');if(c.date>=0)line[c.date]=md;line[c.memo]=text;
        extra.push(line);chg.appendRow=extra.length;
      }else{
        if(c.date>=0){let v='';if(sh.dateFmt==='week')v=wk.label;else if(sh.dateFmt==='ymd')v=latest.date.key;else if(sh.dateFmt==='md')v=String(latest.date.m).padStart(2,'0')+'/'+String(latest.date.d).padStart(2,'0');set(c.date,v)}
        let finalStage=stageOf(main[c.stage]);
        if(c.stage>=0&&stage){const old=stageOf(main[c.stage]);if(smode==='new'?stage!==old:(ORDER[stage]||0)>(ORDER[old]||0)){set(c.stage,stage);finalStage=stage}}
        if(c.status>=0){set(c.status,/인상\s*완료|적용\s*완료|단가인상완료/.test(all)?'완료':(main[c.status]||'진행중'))}
        if(c.kind>=0){const kd=detectKind(all);if(kd)set(c.kind,kd)}
        if(c.amt>=0&&amode==='new'&&amt!=null&&amt>0&&num(main[c.amt])!==amt)set(c.amt,amt.toLocaleString('en-US'));
        if(c.memo>=0){let memo='';
          if(mmode==='std')memo=composeMemo(infos,main[c.memo],(amode==='new'&&amt)?amt:(c.amt>=0?num(main[c.amt]):null),stage,k==='price'?(a=>a?'효과금액 '+a.toLocaleString('en-US')+'천원/년':''):null);
          else{const pri=[/계약특이사항/,/방문내역/,/비고\s*:/];for(const re of pri){const i=infos.find(x=>re.test(x.raw)&&x.memo);if(i){memo=i.memo;break}}if(!memo)memo=(infos.find(x=>x.memo)||{}).memo||''}
          set(c.memo,memo)}
      }
      if(Object.keys(chg).length)updCount++;
    }
    rows.push({code:b.code,cells:main,extra,chg,upd});
  });
  const unmatched=Object.keys(byCode).filter(x=>!codes.has(x)).map(x=>{const d=byCode[x][0];const i=diaryInfo(d);return x+' '+d.name+' ('+d.emp+', '+fmtMD(new Date(d.date.y,d.date.m-1,d.date.d))+', '+i.stage+(i.amt?', '+i.amt.toLocaleString('en-US'):'')+')'});
  st.out={rows,unmatched};
  renderSheet(k);
  $(k+'-stat').textContent='완료: 업무일지 업체 '+(Object.keys(byCode).length-unmatched.length)+'개 일치, '+updCount+'행 갱신';
  const cols=updCols(k);$(k+'-colhint').textContent=cols?colName(cols[0])+'열('+headerName(k,cols[0])+')':'갱신 첫 열';
}
const colName=i=>{let s='';i++;while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26)}return s};
function headerName(k,ci){const ref=S[k].ref;if(!ref||!ref.hdr.length)return '';return ref.hdr.map(r=>String(r[ci]||'').replace(/\s+/g,' ').trim()).filter(Boolean).join(' ')}
function updCols(k){const sh=SHEETS[k],c=S[k].ref.c;const cols=Object.keys(sh.H).filter(h=>h!=='code'&&!(sh.info||[]).includes(h)&&c[h]>=0).map(h=>c[h]);if(!cols.length)return null;return [Math.min(...cols),Math.max(...cols)]}
function visibleRows(k){const st=S[k];return $(k+'-view').value==='all'?st.out.rows:st.out.rows.filter(r=>r.upd)}
function renderSheet(k){const st=S[k],ref=st.ref,c=ref.c,W=ref.W;if(!st.out)return;const eng=!!SHEETS[k].eng;const nameCol=c.name>=0?c.name:c.code+1;
  const widths=Array.from({length:W},(_,i)=>i===c.memo?560:i===c.code?70:80);if(eng)widths.push(96);
  let h='<table class="xl" style="width:'+widths.reduce((a,b)=>a+b,0)+'px"><colgroup>'+widths.map(w=>'<col style="width:'+w+'px">').join('')+'</colgroup>';
  h+='<tr>'+Array.from({length:W},(_,i)=>{const n=headerName(k,i);return '<td class="hg" title="'+esc(n)+'">'+esc(n.slice(0,12))+'</td>'}).join('')+(eng?'<td class="hg">네이버 검색</td>':'')+'</tr>';
  visibleRows(k).forEach(r=>{const ri=st.out.rows.indexOf(r);
    const line=(cells,sub,chgMap)=>'<tr>'+cells.map((v,ci)=>{const key=ri+','+sub+','+ci;const e=st.edits[key];const val=e!=null?e:v;const cls=(ci===c.amt?'n':(ci===c.memo?'txt':'c'))+(chgMap&&chgMap[ci]?' upd':'');
      if(k==='price'&&ci===c.kind&&sub===0)return '<td class="'+cls+'"><select data-rc="'+key+'" style="font-size:10pt;border:0;background:transparent;width:100%">'+['',...PRICE_KINDS].map(o=>'<option'+(o===val?' selected':'')+'>'+o+'</option>').join('')+'</select></td>';
      return '<td class="'+cls+'" contenteditable="true" data-rc="'+key+'" title="'+esc(val)+'"'+(SHEETS[k].eng&&ci===c.memo?' style="white-space:pre-wrap;height:auto"':'')+'>'+esc(val)+'</td>'}).join('')+(eng?'<td style="text-align:center;white-space:nowrap">'+(sub===0?naverLinks(cells[nameCol]):'')+'</td>':'')+'</tr>';
    h+=line(r.cells,0,r.chg);
    r.extra.forEach((x,xi)=>{const isNew=r.chg.appendRow===xi+1;h+=line(x,xi+1,isNew?{[c.date]:1,[c.memo]:1}:null)});
  });
  h+='</table>';$(k+'-preview').innerHTML=h;
}
document.addEventListener('input',e=>{const td=e.target.closest&&e.target.closest('td[data-rc]');if(!td)return;const pane=td.closest('.tabpane');if(!pane)return;const k=pane.id.replace('pane-','');S[k].edits[td.dataset.rc]=td.textContent});
document.addEventListener('change',e=>{const sel=e.target.closest&&e.target.closest('select[data-rc]');if(!sel)return;const pane=sel.closest('.tabpane');if(!pane)return;const k=pane.id.replace('pane-','');S[k].edits[sel.dataset.rc]=sel.value});
function rowLines(k,r){const st=S[k];const ri=st.out.rows.indexOf(r);const get=(cells,sub)=>cells.map((v,ci)=>{const e=st.edits[ri+','+sub+','+ci];let x=String(e!=null?e:v).replace(/\t/g,' ').replace(/\r\n?/g,'\n');if(SHEETS[k].eng&&x.includes('\n'))x='"'+x.replace(/"/g,'""')+'"';else x=x.replace(/\n/g,' ');return x});
  return [get(r.cells,0),...r.extra.map((x,i)=>get(x,i+1))]}
function tsv(k,rows,c0=0,c1=null){const out=[];rows.forEach(r=>rowLines(k,r).forEach(v=>out.push(v.slice(c0,c1==null?v.length:c1).join('\t'))));return out.join('\r\n')}
Object.keys(SHEETS).forEach(k=>{
  $(k+'-run').onclick=()=>runSheet(k);
  $(k+'-view').onchange=()=>renderSheet(k);
  ['stagemode','amtmode','memomode'].forEach(o=>{const el=$(k+'-'+o);if(el)el.onchange=()=>{if(S[k].out)runSheet(k)}});
  $(k+'-copyUpd').onclick=async()=>{const st=S[k];if(!st.out)return;const rows=st.out.rows.filter(r=>r.upd);const ok=await copyText(tsv(k,rows));$(k+'-stat').textContent=ok?'업데이트 '+rows.length+'개 업체 값 복사됨':'복사 실패'};
  $(k+'-copyAll').onclick=async()=>{const st=S[k];if(!st.out)return;const ok=await copyText(tsv(k,st.out.rows));$(k+'-stat').textContent=ok?'전체 '+st.out.rows.length+'개 업체 값 복사됨 → 첫 데이터 행의 첫 셀에 붙여넣기':'복사 실패'};
  $(k+'-copyCols').onclick=async()=>{const st=S[k];if(!st.out)return;const cols=updCols(k);if(!cols)return;const ok=await copyText(tsv(k,st.out.rows,cols[0],cols[1]+1));$(k+'-stat').textContent=ok?colName(cols[0])+'~'+colName(cols[1])+'열 값 복사됨 → 첫 데이터 행의 '+colName(cols[0])+'열 셀에 붙여넣기':'복사 실패'};
  $(k+'-ref').addEventListener('cleared',()=>{S[k].ref=null;S[k].out=null;$(k+'-preview').innerHTML='';$(k+'-refstat').textContent='';$(k+'-stat').textContent=''});
});
$('diary').addEventListener('cleared',()=>{$('diarystat').textContent='';Object.keys(S).forEach(k=>{S[k].out=null;$(k+'-preview').innerHTML='';$(k+'-stat').textContent=''})});
$('wkdate').onchange=()=>onWeekChange(true);$('wklabel').onchange=()=>onWeekChange(false);
(()=>{const t=new Date();$('wkdate').value=t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');onWeekChange(true)})();
addClearButtons();

/* ===== 화면 확대/축소 ===== */
(function(){const main=document.querySelector('main');let z=1;try{z=parseFloat(localStorage.getItem('ui_zoom'))||1}catch(e){}
  const apply=()=>{z=Math.min(1.5,Math.max(0.5,Math.round(z*10)/10));if('zoom' in main.style){main.style.zoom=z}else{main.style.transform='scale('+z+')';main.style.transformOrigin='top left';main.style.width=(100/z)+'%'}
    document.getElementById('zoomVal').textContent=Math.round(z*100)+'%';try{localStorage.setItem('ui_zoom',String(z))}catch(e){}};
  document.getElementById('zoomIn').onclick=()=>{z+=0.1;apply()};document.getElementById('zoomOut').onclick=()=>{z-=0.1;apply()};document.getElementById('zoomReset').onclick=()=>{z=1;apply()};apply()})();
</script>
</body>
